name: Robot vehicle bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKEND_URL: http://127.0.0.1:8000
      ADB_SERIAL: 127.0.0.1:5555
      BODY_ECU_ADDR: 127.0.0.1:50051
      VEHICLE_API_KEY: dev-key-001
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter/requirements.txt

      - name: Install test tools
        run: |
          python -m pip install -r starter/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes adb
          docker compose version

      - name: Check test helpers and keyword resolution
        run: |
          python -m unittest discover -s starter/robot/checks -v
          python -m robot --outputdir results/ci/offline starter/robot/checks/assertions.robot
          python -m robot --dryrun --outputdir results/ci/dryrun starter/robot/tests

      - name: Start a fresh bench
        timeout-minutes: 10
        run: |
          # Remove historical evidence only in this disposable CI checkout.
          mkdir -p traces/logs traces/pcap/live results/ci/diagnostics
          find traces/logs -maxdepth 1 -type f -name '*.dlt' -delete
          find traces/pcap/live -maxdepth 1 -type f -name '*.pcap' -delete
          # Build first: capture-cloud shares the image built by capture-tcu.
          docker compose build
          docker compose up --detach --wait --wait-timeout 120

      - name: Wait for ADB and initial vehicle telemetry
        timeout-minutes: 2
        run: |
          adb start-server
          for attempt in $(seq 1 30); do
            adb connect "$ADB_SERIAL"
            if adb -s "$ADB_SERIAL" get-state; then
              break
            fi
            sleep 2
          done
          adb -s "$ADB_SERIAL" get-state
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 45
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request(
                      os.environ['BACKEND_URL'] + '/vehicle/status',
                      headers={'X-API-Key': os.environ['VEHICLE_API_KEY']},
                  )
                  with urllib.request.urlopen(request, timeout=3) as response:
                      status = json.load(response)
                  if status['connectivity']['ecu_online'] and status['doors']['locked'] is not None:
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Vehicle telemetry did not become ready within 45 seconds')
          PY

      - name: Run all Robot tests
        timeout-minutes: 10
        run: |
          # Sequential execution is required: tests share vehicle state and stop/start the ECU.
          python -m robot --outputdir results/ci/robot --xunit xunit.xml starter/robot/tests

      - name: Collect diagnostics and stop the bench
        if: always()
        run: |
          mkdir -p results/ci/diagnostics
          docker compose ps --all > results/ci/diagnostics/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > results/ci/diagnostics/compose.log 2>&1 || true
          adb devices -l > results/ci/diagnostics/adb-devices.txt 2>&1 || true
          # Stop packet captures before uploading so their final buffers are flushed.
          docker compose down --volumes --remove-orphans

      - name: Upload test reports and bench evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robot-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/ci/
            traces/logs/*.dlt
            traces/pcap/live/*.pcap
          if-no-files-found: warn
          retention-days: 14
